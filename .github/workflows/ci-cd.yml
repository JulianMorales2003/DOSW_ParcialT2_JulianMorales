name: CI/CD — DOSW Parcial T2

on:
  push:
    branches: [ main, develop ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dosw-parcial-t2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: maven }
      - name: Build y pruebas
        run: mvn verify --no-transfer-progress
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  # Despliegue en Azure: queda apagado hasta que exista el App Service.
  # Para activarlo: Settings → Secrets and variables → Actions → Variables
  # y crear la variable DEPLOY_AZURE con valor true.
  deploy:
    needs: docker
    if: ${{ vars.DEPLOY_AZURE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_NAME }}:latest
